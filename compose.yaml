services:
  migrate:
    build: .
    command: ["/usr/local/bin/email-news-migrate", "up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
    restart: "no"

  app:
    build: .
    ports:
      - "${PORT:-8004}:8004"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      PORT: 8004
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8004}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

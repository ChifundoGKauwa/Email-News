[package]
name = "Email-news"
version = "0.1.0"
edition = "2024"

[dependencies]
axum="0.8.9"
tokio={version="1",features=["full"]}
serde={version="1",features=["derive"]}
serde_json="1"
sea-orm={version="1.0.0 ",features=["sqlx-postgres","runtime-tokio-native-tls","macros"]}
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
jsonwebtoken = "9"
email_address = "0.2"
bcrypt = "0.17"
lettre = { version = "0.11.7", features = ["builder", "smtp-transport", "tokio1-native-tls"] }
